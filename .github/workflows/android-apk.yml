name: Build Music Pro Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - music-pro-android-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Music Pro
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify Capacitor packages
        run: npm ls @capacitor/core @capacitor/cli @capacitor/android

      - name: Install exact Capacitor Android platform
        run: npm install --no-save @capacitor/android@7.4.3 @capacitor/cli@7.4.3 @capacitor/core@7.4.3

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.webmanifest sw.js www/
          cp -R icons www/icons

      - name: Create Android project
        run: npx --yes @capacitor/cli@7.4.3 add android --verbose

      - name: Sync Music Pro into Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Music Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: music-pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
