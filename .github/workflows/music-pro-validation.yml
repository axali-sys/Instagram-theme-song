name: Music Pro production validation

on:
  push:
    branches:
      - main
      - music-pro-vercel-complete
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax validation
        run: |
          node --check app.js
          for f in api/*.js lib/*.js; do node --check "$f"; done
      - name: Smoke tests
        run: npm test
